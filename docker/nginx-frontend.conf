# ============================================================================
# EKLIPSE FUNDED — FRONTEND SPA & ASSET CACHING REVERSE PROXY
# ============================================================================
# Cumple la regla de rendimiento institucional:
# 1. Caché inmutable por 1 año (HTTP 31536000s) para assets estáticos.
# 2. Compresión Gzip para sub-50ms TTFB.
# 3. Fallback SPA para enrutamiento limpio /crm, /terminal, /challenges.
# ============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip de alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Caché inmutable por 1 año para assets estáticos con hash de Vite
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy inverso transparente al Trading Server WebSocket & HTTP API
    location /ws-gateway {
        proxy_pass http://eklipse-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Fallback SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
