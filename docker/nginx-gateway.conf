# ============================================================================
# EKLIPSE FUNDED — SUPABASE LOCAL API GATEWAY (NGINX)
# ============================================================================
# Enruta peticiones de @supabase/supabase-js y clientes REST hacia PostgREST
# con paridad 1:1 idéntica a Supabase Cloud en local y en producción VPS.
# ============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 54321;
        listen [::]:54321;
        server_name localhost;

        # Ocultar tokens sensibles en logs
        access_log off;

        # Cabeceras CORS universales
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, X-Client-Info, apikey, x-supabase-api-version' always;
        add_header 'Access-Control-Expose-Headers' 'content-range, content-length, accept-ranges' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health check instantáneo
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","engine":"Eklipse Supabase Gateway","service":"postgrest-proxy"}';
        }

        # Compatibilidad @supabase/supabase-js: /rest/v1/* -> /*
        location /rest/v1/ {
            rewrite ^/rest/v1/(.*)$ /$1 break;
            proxy_pass http://eklipse-api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Compatibilidad PostgREST Directo: /* -> /*
        location / {
            proxy_pass http://eklipse-api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
