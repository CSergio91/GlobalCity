# ============================================================================
# EKLIPSE FUNDED — SUPABASE LOCAL API GATEWAY (NGINX)
# ============================================================================
# Enruta peticiones de @supabase/supabase-js y clientes REST hacia PostgREST
# y GoTrue con paridad 1:1 idéntica a Supabase Cloud en local y en VPS.
# ============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 54321;
        listen [::]:54321;
        server_name localhost;

        # Ocultar tokens sensibles en logs
        access_log off;

        # Cabeceras CORS universales controladas por NGINX (sin duplicación)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, X-Client-Info, apikey, x-supabase-api-version, accept-profile, content-profile, range, x-retry-count, If-Match' always;
        add_header 'Access-Control-Expose-Headers' 'content-range, content-length, accept-ranges, X-Total-Count, Link, X-Supabase-Api-Version' always;

        # Preflight OPTIONS universal
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health check instantáneo
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","engine":"Eklipse Supabase Gateway","service":"postgrest-proxy"}';
        }

        # GoTrue Auth: Ocultar cabeceras CORS del backend para evitar duplicados ('*, *')
        location /auth/v1/ {
            rewrite ^/auth/v1/(.*)$ /$1 break;
            proxy_pass http://eklipse-auth:9999;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Evita 'Access-Control-Allow-Origin: *, *' duplicado por el upstream
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
        }

        # PostgREST Database: Ocultar cabeceras CORS del backend para evitar duplicados
        location /rest/v1/ {
            rewrite ^/rest/v1/(.*)$ /$1 break;
            proxy_pass http://eklipse-api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Evita 'Access-Control-Allow-Origin: *, *' duplicado por PostgREST
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
        }

        # Supabase Edge Functions: Proxy dinámico para paridad 1:1 local y VPS
        location /functions/v1/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $upstream_functions http://eklipse-functions:9000;
            rewrite ^/functions/v1/(.*)$ /$1 break;
            proxy_pass $upstream_functions;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
        }

        # PostgREST Directo
        location / {
            proxy_pass http://eklipse-api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
        }
    }
}
