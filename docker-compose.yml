# ============================================================================
# EKLIPSE FUNDED — INSTITUTIONAL DOCKER COMPOSE STACK
# ============================================================================
# Infraestructura completa de producción y desarrollo local para Empresa de Fondeo.
# Incluye:
# 1. PostgreSQL 16 Alpine con migraciones automáticas (/docker-entrypoint-initdb.d)
# 2. Redis 7.2 Alpine In-Memory con persistencia AOF y desalojo LRU
# 3. PostgREST v12 Engine (API REST relacional de baja latencia)
# 4. Supabase API Gateway (Nginx proxy /rest/v1 con CORS universales en :54321)
# 5. Eklipse Trading Gateway & Risk Daemon (WebSocket multiplexado, cron weekend)
# 6. Eklipse Web Frontend (Compilación SPA optimizada con caché inmutable)
# ============================================================================

services:
  # ============================================================================
  # 1. BASE DE DATOS POSTGRESQL 16 (Persistencia Relacional Eklipse Funded)
  # ============================================================================
  eklipse-db:
    image: postgres:16-alpine
    container_name: eklipse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eklipse_funded}
      POSTGRES_USER: ${POSTGRES_USER:-eklipse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eklipse_secret_pass_local}
    ports:
      - "${PORT_DB:-5432}:5432"
    volumes:
      - eklipse_pg_data:/var/lib/postgresql/data
      - ./docker/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eklipse_admin} -d ${POSTGRES_DB:-eklipse_funded}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eklipse_net

  # ============================================================================
  # 2. REDIS 7.2 IN-MEMORY (Hot State, Streams, Pre-Trade Locks y Fan-Out)
  # ============================================================================
  eklipse-redis:
    image: redis:7.2-alpine
    container_name: eklipse_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${PORT_REDIS:-6379}:6379"
    volumes:
      - eklipse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eklipse_net

  # ============================================================================
  # 3. POSTGREST REST ENGINE (Motor REST interno sobre PostgreSQL)
  # ============================================================================
  eklipse-api:
    image: postgrest/postgrest:v12.2.0
    container_name: eklipse_postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-eklipse_admin}:${POSTGRES_PASSWORD:-eklipse_secret_pass_local}@eklipse-db:5432/${POSTGRES_DB:-eklipse_funded}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-eklipse_jwt_secret_super_secure_institutional_32bytes_min}
      PGRST_DB_POOL: 10
    depends_on:
      eklipse-db:
        condition: service_healthy
    networks:
      - eklipse_net

  # ============================================================================
  # 3.5. SUPABASE AUTH ENGINE (GoTrue v2.177.0 — Autenticación Oficial Supabase)
  # ============================================================================
  eklipse-auth:
    image: supabase/gotrue:v2.177.0
    container_name: eklipse_auth
    restart: unless-stopped
    command: ["gotrue", "serve"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://${POSTGRES_USER:-eklipse_admin}:${POSTGRES_PASSWORD:-eklipse_secret_pass_local}@eklipse-db:5432/${POSTGRES_DB:-eklipse_funded}?sslmode=disable
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:54321}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-${VITE_APP_URL:-http://localhost:3100}}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-*}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-eklipse_jwt_secret_super_secure_institutional_32bytes_min}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-3600}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      # Servidor SMTP Oficial Resend (Dominio eklipsefunded.com Verificado)
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-resend}
      GOTRUE_SMTP_PASS: ${RESEND_API_KEY}
      GOTRUE_SMTP_ADMIN_EMAIL: ${RESEND_FROM_EMAIL:-soporte@eklipsefunded.com}
      GOTRUE_SMTP_SENDER_NAME: ${RESEND_SENDER_NAME:-Eklipse Funded}
      # Google OAuth Provider (Parametrizado sin hardcodear)
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-}
    depends_on:
      eklipse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9999/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eklipse_net

  # ============================================================================
  # 4. SUPABASE API GATEWAY (NGINX Proxy con paridad 1:1 para @supabase/supabase-js)
  # ============================================================================
  eklipse-gateway:
    image: nginx:alpine
    container_name: eklipse_supabase_gateway
    restart: unless-stopped
    ports:
      - "${PORT_SUPABASE:-54321}:54321"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - eklipse-api
      - eklipse-auth
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:54321/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eklipse_net

  # ============================================================================
  # 5. EKLIPSE TRADING GATEWAY & RISK DAEMON (WebSocket Server y Risk Guardian)
  # ============================================================================
  eklipse-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: eklipse_trading_server
    restart: unless-stopped
    ports:
      - "${PORT_SERVER:-8088}:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      REDIS_URL: redis://eklipse-redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-eklipse_admin}:${POSTGRES_PASSWORD:-eklipse_secret_pass_local}@eklipse-db:5432/${POSTGRES_DB:-eklipse_funded}
      SUPABASE_URL: http://eklipse-gateway:54321
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjUwMDAwMDAwMH0.yCCh-b9rqQG1HpSahN4yzA_XAMpk_ygf_LcjtFJQhUk}
    depends_on:
      eklipse-redis:
        condition: service_healthy
      eklipse-db:
        condition: service_healthy
      eklipse-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eklipse_net

  # ============================================================================
  # 6. EKLIPSE WEB FRONTEND & CRM (Servidor Nginx para Despliegue VPS / Producción)
  # ============================================================================
  eklipse-web:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: eklipse_web_frontend
    restart: unless-stopped
    ports:
      - "${PORT_WEB:-3180}:80"
    depends_on:
      - eklipse-server
      - eklipse-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - eklipse_net

  # ============================================================================
  # 7. VISUAL DATABASE STUDIO (Panel Web Visual para Explorar Tablas y Datos)
  # ============================================================================
  eklipse-studio:
    image: adminer:latest
    container_name: eklipse_db_studio
    restart: unless-stopped
    ports:
      - "${PORT_STUDIO:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: eklipse-db
    depends_on:
      - eklipse-db
    networks:
      - eklipse_net

volumes:
  eklipse_pg_data:
    driver: local
  eklipse_redis_data:
    driver: local

networks:
  eklipse_net:
    driver: bridge
