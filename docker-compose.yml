services:
  # ============================================================================
  # 1. BASE DE DATOS POSTGRESQL 16 (Compatible con Supabase / Migraciones Locales)
  # ============================================================================
  eklipse-db:
    image: postgres:16-alpine
    container_name: eklipse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eklipse_funded
      POSTGRES_USER: eklipse_admin
      POSTGRES_PASSWORD: eklipse_secret_pass_local
    ports:
      - "5432:5432"
    volumes:
      - eklipse_pg_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eklipse_admin -d eklipse_funded"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. REDIS 7 IN-MEMORY (Hot State, Streams, Pre-Trade Locks y Fan-Out)
  # ============================================================================
  eklipse-redis:
    image: redis:7.2-alpine
    container_name: eklipse_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - eklipse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. EKLIPSE TRADING GATEWAY & RISK DAEMON (Servidor de Producción / Pre-VPS)
  # ============================================================================
  eklipse-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: eklipse_trading_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      REDIS_URL: redis://eklipse-redis:6379
      DATABASE_URL: postgresql://eklipse_admin:eklipse_secret_pass_local@eklipse-db:5432/eklipse_funded
    depends_on:
      eklipse-redis:
        condition: service_healthy
      eklipse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eklipse_pg_data:
    driver: local
  eklipse_redis_data:
    driver: local
